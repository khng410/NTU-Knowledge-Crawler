name: Weekly NTU knowledge update

on:
  schedule:
    - cron: "0 1 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run tests
        run: python3 -m unittest discover -s tests -v
      - name: Update knowledge base
        run: python3 main.py --skip-pdfs
      - name: Upload generated audit and data
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ntu-knowledge-update
          path: |
            database/ntu_kb.db
            output/
          retention-days: 30
